{% extends 'blog_app/base.html' %}

{% block content %}

<!-- Back Navigation -->
<div class="mb-8 font-mono text-xs">
  <a href="{% url 'blog_app:posts' %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4">
    &lt;-- back_to_log_archive
  </a>
</div>

<div class="w-full font-mono">

  <!-- Terminal Header Signal -->
  <div class="flex justify-between items-baseline border-b border-gray-600 dark:border-gray-700 pb-2 mb-8">
    <h1 class="text-2xl font-mono uppercase tracking-wider text-gray-700 dark:text-gray-200">
      SESSIONE_TERMINATA <span class="text-xs font-normal lowercase text-gray-400 dark:text-gray-500">// disconnesso</span>
    </h1>
  </div>

  <!-- Terminal Output Card -->
  <div class="border border-gray-600 dark:border-gray-700 p-6 space-y-6 text-xs">
    <div class="space-y-2">
      <div class="text-gray-800 dark:text-gray-200 font-bold uppercase tracking-wide text-sm flex items-center space-x-2">
        <span>[OK]</span>
        <h2>DISCONNESSIONE_EFFETTUATA</h2>
      </div>
      <p class="text-gray-600 dark:text-gray-300">
        // La sessione utente è stata chiusa con successo.
      </p>
    </div>

    <!-- Action Links Bar -->
    <div class="pt-6 border-t border-gray-300 dark:border-gray-800 flex flex-wrap items-center justify-between gap-4">
      <a href="{% url 'blog_app:posts' %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4">
        &lt;-- return_to_posts
      </a>

      <a href="{% url 'accounts:login' %}" class="text-gray-800 dark:text-gray-200 font-bold underline underline-offset-4 hover:text-black dark:hover:text-white">
        [autenticati_di_nuovo --&gt;]
      </a>
    </div>
  </div>

</div>

{% endblock content %}
