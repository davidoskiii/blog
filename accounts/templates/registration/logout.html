{% extends 'blog_app/base.html' %}

{% block content %}

<!-- Back Navigation -->
<div class="mb-6 sm:mb-8 font-mono text-xs">
  <a href="{% url 'blog_app:posts' %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4 py-1 inline-block whitespace-nowrap">
    &lt;-- back_to_log_archive
  </a>
</div>

<div class="w-full font-mono">

  <!-- Terminal Header Signal -->
  <header class="border-b border-gray-500 dark:border-gray-700 pb-3 mb-6 sm:mb-8">
    <h1 class="text-xl sm:text-2xl font-mono font-bold uppercase tracking-wider text-gray-800 dark:text-gray-100 break-words">
      SESSIONE_TERMINATA <span class="block sm:inline text-xs font-normal lowercase text-gray-400 dark:text-gray-500 mt-0.5 sm:mt-0">// disconnesso</span>
    </h1>
  </header>

  <!-- Terminal Output Card -->
  <div class="border border-gray-500 dark:border-gray-700 p-4 sm:p-6 space-y-5 text-xs">
    <div class="space-y-2">
      <div class="text-gray-800 dark:text-gray-200 font-bold uppercase tracking-wide text-xs sm:text-sm flex items-baseline gap-2">
        <span class="shrink-0 whitespace-nowrap">[OK]</span>
        <h2 class="break-words">DISCONNESSIONE_EFFETTUATA</h2>
      </div>
      <p class="text-gray-600 dark:text-gray-300 leading-relaxed break-words">
        // La sessione utente è stata chiusa con successo.
      </p>
    </div>

    <!-- Action Links Bar -->
    <div class="pt-4 border-t border-gray-200 dark:border-gray-800 flex flex-wrap items-center justify-between gap-3">
      <a href="{% url 'blog_app:posts' %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4 py-1 whitespace-nowrap">
        &lt;-- back_to_log_archive
      </a>

      <a href="{% url 'accounts:login' %}" class="text-gray-800 dark:text-gray-200 font-bold underline underline-offset-4 hover:text-black dark:hover:text-white py-1 whitespace-nowrap">
        [autenticati --&gt;]
      </a>
    </div>
  </div>

</div>

{% endblock content %}
