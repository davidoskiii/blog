{% extends 'blog_app/base.html' %}

{% block content %}

<!-- Back Navigation -->
<div class="mb-8 font-mono text-xs">
  <a href="{% url 'blog_app:folder' folder.id %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4">
    &lt;-- back_to_folder
  </a>
</div>

<div class="w-full font-mono">
  <!-- Section Header -->
  <div class="flex justify-between items-baseline border-b border-gray-600 dark:border-gray-700 pb-2 mb-8">
    <h1 class="text-2xl font-mono uppercase tracking-wider text-gray-700 dark:text-gray-200">
      MODIFICA_FOLDER <span class="text-xs font-normal lowercase text-gray-400 dark:text-gray-500">// {{ folder.name }}</span>
    </h1>
  </div>

  <!-- Main Edit Form -->
  <form action="{% url 'blog_app:edit_folder' folder.id %}" method="post" class="space-y-6 w-full">
      {% csrf_token %}
      
      <!-- Django Form Styling Wrapper -->
      <div class="space-y-4 text-xs w-full
                  [&_label]:block [&_label]:text-gray-500 dark:[&_label]:text-gray-400 [&_label]:uppercase [&_label]:tracking-wider [&_label]:mb-1
                  [&_input]:w-full [&_input]:p-2 [&_input]:border [&_input]:border-gray-600 dark:[&_input]:border-gray-700 [&_input]:bg-transparent [&_input]:text-sm [&_input]:text-gray-800 dark:[&_input]:text-gray-200 [&_input]:focus:outline-none [&_input]:focus:border-black dark:[&_input]:focus:border-gray-400
                  [&_textarea]:w-full [&_textarea]:p-2 [&_textarea]:border [&_textarea]:border-gray-600 dark:[&_textarea]:border-gray-700 [&_textarea]:bg-transparent [&_textarea]:text-sm [&_textarea]:text-gray-800 dark:[&_textarea]:text-gray-200 [&_textarea]:focus:outline-none [&_textarea]:focus:border-black dark:[&_textarea]:focus:border-gray-400
                  [&_select]:w-full [&_select]:p-2 [&_select]:border [&_select]:border-gray-600 dark:[&_select]:border-gray-700 [&_select]:bg-transparent [&_select]:text-sm [&_select]:text-gray-800 dark:[&_select]:text-gray-200 [&_select]:focus:outline-none [&_select]:focus:border-black dark:[&_select]:focus:border-gray-400
                  [&_.helptext]:block [&_.helptext]:text-[11px] [&_.helptext]:text-gray-400 dark:[&_.helptext]:text-gray-500 [&_.helptext]:mt-1">
        {{ form.as_div }}
      </div>

      <!-- Form Actions Bar -->
      <div class="pt-6 flex items-center justify-between border-t border-gray-300 dark:border-gray-800 text-xs">
        <button type="submit" form="delete-folder-form" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4 cursor-pointer">
          [- elimina_folder]
        </button>

        <div class="flex items-center space-x-4">
          <a href="{% url 'blog_app:folder' folder.id %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline cursor-pointer">
            annulla
          </a>
          <button type="submit" name="submit" class="text-gray-800 dark:text-gray-200 hover:text-black dark:hover:text-white font-bold underline underline-offset-4 cursor-pointer">
            [salva_modifiche]
          </button>
        </div>
      </div>
  </form>

  <!-- Separate Hidden Form for Deletion -->
  <form id="delete-folder-form" action="{% url 'blog_app:delete_folder' folder.id %}" method="post" onsubmit="return confirm('Sei sicuro di voler eliminare questa folder? I post al suo interno NON verranno eliminati.');">
      {% csrf_token %}
  </form>
</div>

{% endblock content %}
