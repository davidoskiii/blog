{% extends 'blog_app/base.html' %}

{% block content %}
<div class="bg-white rounded-2xl p-8 sm:p-12 shadow-sm border border-gray-100 text-center my-8">
  <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-4">
    Benvenuto nel Blog Personale
  </h1>
  <p class="text-lg text-gray-600 max-w-2xl mx-auto mb-8">
    Esplora articoli, riflessioni e novità organizzati per categoria.
  </p>
  <div class="flex justify-center gap-4">
    <a href="{% url 'blog_app:posts' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition shadow-md">
      Sfoglia i Posts
    </a>
  </div>
</div>
{% endblock content %}
