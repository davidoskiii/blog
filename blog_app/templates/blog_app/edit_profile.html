{% extends 'blog_app/base.html' %}

{% block content %}

<div class="mb-8 font-mono text-xs">
  <a href="{% url 'blog_app:profile' user.username %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4">
    &lt;-- cancel_and_back_to_profile
  </a>
</div>

<div class="w-full font-mono">
  <div class="border-b border-gray-600 dark:border-gray-700 pb-2 mb-8">
    <h1 class="text-2xl uppercase tracking-wider text-gray-700 dark:text-gray-200 font-bold">
      MODIFICA_PROFILO <span class="text-xs font-normal lowercase text-gray-400 dark:text-gray-500">// @{{ user.username }}</span>
    </h1>
  </div>

  <form method="post" action="{% url 'blog_app:edit_profile' %}" class="space-y-6 text-xs">
    {% csrf_token %}
    
    <div>
      <label class="block text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Nome</label>
      <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full p-2 border border-gray-600 dark:border-gray-700 bg-transparent text-sm text-gray-800 dark:text-gray-200 focus:outline-none focus:border-black dark:focus:border-gray-400">
    </div>

    <div>
      <label class="block text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Cognome</label>
      <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full p-2 border border-gray-600 dark:border-gray-700 bg-transparent text-sm text-gray-800 dark:text-gray-200 focus:outline-none focus:border-black dark:focus:border-gray-400">
    </div>

    <div>
      <label class="block text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Biografia</label>
      <textarea name="bio" rows="4" class="w-full p-2 border border-gray-600 dark:border-gray-700 bg-transparent text-sm text-gray-800 dark:text-gray-200 focus:outline-none focus:border-black dark:focus:border-gray-400">{{ profile.bio|default:"" }}</textarea>
    </div>

    <div class="pt-4 border-t border-gray-300 dark:border-gray-800 flex justify-end space-x-4">
      <a href="{% url 'blog_app:profile' user.username %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline">annulla</a>
      <button type="submit" class="font-bold text-gray-800 dark:text-gray-200 hover:text-black dark:hover:text-white underline">[salva_profilo]</button>
    </div>
  </form>
</div>

{% endblock content %}
