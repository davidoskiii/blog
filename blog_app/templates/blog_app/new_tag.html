{% extends 'blog_app/base.html' %}

{% block content %}

<!-- Back Navigation -->
<div class="mb-6 sm:mb-8 font-mono text-xs">
  <a href="{% url 'blog_app:posts' %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4 py-1 inline-block whitespace-nowrap">
    &lt;-- back_to_log_archive
  </a>
</div>

<div class="w-full font-mono">
  <!-- Section Header -->
  <header class="border-b border-gray-500 dark:border-gray-700 pb-3 mb-6 sm:mb-8">
    <h1 class="text-xl sm:text-2xl font-mono font-bold uppercase tracking-wider text-gray-800 dark:text-gray-100 break-words">
      NUOVO_TAG <span class="block sm:inline text-xs font-normal lowercase text-gray-400 dark:text-gray-500 mt-0.5 sm:mt-0">// crea tag</span>
    </h1>
  </header>

  <!-- Main Form -->
  <form action="{% url 'blog_app:new_tag' %}" method="post" class="space-y-6 w-full">
    {% csrf_token %}
    
    <div class="space-y-4 text-xs w-full
                [&_label]:block [&_label]:text-gray-500 dark:[&_label]:text-gray-400 [&_label]:uppercase [&_label]:tracking-wider [&_label]:mb-1.5
                [&_input]:w-full [&_input]:p-2.5 [&_input]:border [&_input]:border-gray-500 dark:[&_input]:border-gray-700 [&_input]:bg-transparent [&_input]:text-base [&_input]:sm:text-sm [&_input]:text-gray-800 dark:[&_input]:text-gray-200 [&_input]:focus:outline-none [&_input]:focus:border-black dark:[&_input]:focus:border-gray-300 [&_input]:box-border
                [&_textarea]:w-full [&_textarea]:p-2.5 [&_textarea]:border [&_textarea]:border-gray-500 dark:[&_textarea]:border-gray-700 [&_textarea]:bg-transparent [&_textarea]:text-base [&_textarea]:sm:text-sm [&_textarea]:text-gray-800 dark:[&_textarea]:text-gray-200 [&_textarea]:focus:outline-none [&_textarea]:focus:border-black dark:[&_textarea]:focus:border-gray-300 [&_textarea]:box-border
                [&_.helptext]:block [&_.helptext]:text-[11px] [&_.helptext]:text-gray-400 dark:[&_.helptext]:text-gray-500 [&_.helptext]:mt-1
                [&_.errorlist]:text-red-500 [&_.errorlist]:text-xs [&_.errorlist]:mt-1">
      {{ form.as_div }}
    </div>
    
    <!-- Form Actions Bar -->
    <div class="pt-5 flex items-center justify-end gap-4 border-t border-gray-200 dark:border-gray-800 text-xs">
      <a href="{% url 'blog_app:posts' %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4 py-1 whitespace-nowrap">
        [annulla]
      </a>
      <button type="submit" name="submit" class="text-gray-800 dark:text-gray-200 hover:text-black dark:hover:text-white font-bold underline underline-offset-4 cursor-pointer py-1 whitespace-nowrap">
        [+ crea]
      </button>
    </div>
  </form>
</div>

{% endblock content %}
