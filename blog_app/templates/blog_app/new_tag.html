{% extends 'blog_app/base.html' %}

{% block content %}

<!-- Back Navigation -->
<div class="mb-8 font-mono text-xs">
  <a href="{% url 'blog_app:posts' %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline underline-offset-4">
    &lt;-- cancel_and_back_to_archive
  </a>
</div>

<div class="w-full font-mono">
  <!-- Section Header -->
  <div class="flex justify-between items-baseline border-b border-gray-600 dark:border-gray-700 pb-2 mb-8">
    <h1 class="text-2xl font-mono uppercase tracking-wider text-gray-700 dark:text-gray-200">
      NUOVO_TAG <span class="text-xs font-normal lowercase text-gray-400 dark:text-gray-500">// crea tag</span>
    </h1>
  </div>

  <!-- Main Form -->
  <form action="{% url 'blog_app:new_tag' %}" method="post" class="space-y-6 w-full">
      {% csrf_token %}
      
      <!-- Django Form Styling Wrapper -->
      <div class="space-y-4 text-xs w-full
                  [&_label]:block [&_label]:text-gray-500 dark:[&_label]:text-gray-400 [&_label]:uppercase [&_label]:tracking-wider [&_label]:mb-1
                  [&_input]:w-full [&_input]:p-2 [&_input]:border [&_input]:border-gray-600 dark:[&_input]:border-gray-700 [&_input]:bg-transparent [&_input]:text-sm [&_input]:text-gray-800 dark:[&_input]:text-gray-200 [&_input]:focus:outline-none [&_input]:focus:border-black dark:[&_input]:focus:border-gray-400
                  [&_textarea]:w-full [&_textarea]:p-2 [&_textarea]:border [&_textarea]:border-gray-600 dark:[&_textarea]:border-gray-700 [&_textarea]:bg-transparent [&_textarea]:text-sm [&_textarea]:text-gray-800 dark:[&_textarea]:text-gray-200 [&_textarea]:focus:outline-none [&_textarea]:focus:border-black dark:[&_textarea]:focus:border-gray-400">
        {{ form.as_div }}
      </div>
      
      <!-- Form Actions Bar -->
      <div class="pt-6 flex items-center justify-end space-x-4 border-t border-gray-300 dark:border-gray-800 text-xs">
        <a href="{% url 'blog_app:posts' %}" class="text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white underline cursor-pointer">
          annulla
        </a>
        <button type="submit" name="submit" class="text-gray-800 dark:text-gray-200 hover:text-black dark:hover:text-white font-bold underline underline-offset-4 cursor-pointer">
          [+ crea_tag]
        </button>
      </div>
  </form>
</div>

{% endblock content %}
