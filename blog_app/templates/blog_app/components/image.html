<figure class="mt-8 mb-6">
  <!-- Outer Container -->
  <div 
    x-data="{ isMaximized: false }" 
    @keydown.escape.window="isMaximized = false"
    class="relative group max-w-full md:max-w-2xl mx-auto border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-gray-900 shadow-lg font-mono overflow-hidden select-none"
  >
    <!-- Image Container -->
    <div class="relative w-full bg-gray-200/50 dark:bg-black/40 {% if is_relative %}h-auto p-2 flex items-center justify-center{% else %}h-[200px] sm:h-[320px]{% endif %}">
      {% if is_relative %}
        <img 
          src="{{ src }}" 
          alt="{{ alt }}" 
          @click="isMaximized = true"
          class="w-full h-auto max-h-[75vh] object-contain mx-auto cursor-zoom-in"
          loading="lazy"
        />
      {% else %}
        <div class="absolute inset-0 flex items-center justify-center p-2">
          <img 
            src="{{ src }}" 
            alt="{{ alt }}" 
            @click="isMaximized = true"
            class="max-h-full max-w-full object-contain mx-auto cursor-zoom-in"
            loading="lazy"
          />
        </div>
      {% endif %}
    </div>

    <!-- Retro Badge Indicator -->
    <div class="absolute bottom-2 right-2 bg-gray-200/80 dark:bg-black/70 px-2 py-0.5 border border-gray-400 dark:border-gray-700 text-[10px] text-gray-700 dark:text-gray-300 z-10">
      [<span class="text-black dark:text-white font-bold">IMG</span>]
    </div>

    <!-- Full-Screen Lightbox Modal -->
    <div 
      x-show="isMaximized" 
      @click="isMaximized = false"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex flex-col items-center justify-center p-4 sm:p-8 cursor-pointer"
      style="display: none;"
    >
      <!-- Top Action Bar -->
      <div class="absolute top-4 right-4 flex items-center space-x-4 z-50" @click.stop>
        <button 
          @click="isMaximized = false" 
          type="button" 
          class="text-gray-300 hover:text-white border border-gray-600 hover:border-gray-400 px-3 py-1 text-xs font-mono bg-black/60 transition cursor-pointer"
        >
          [x] Chiudi
        </button>
      </div>

      <!-- Maximized Image Container -->
      <div class="relative w-full h-full flex items-center justify-center">
        <img 
          src="{{ src }}" 
          alt="{{ alt }} Maximized" 
          @click.stop
          class="max-h-full max-w-full object-contain mx-auto shadow-2xl cursor-default"
        />
      </div>

      <!-- Caption Overlay in Lightbox -->
      {% if caption %}
        <div class="absolute bottom-4 inset-x-0 text-center px-4" @click.stop>
          <p class="text-xs text-gray-300 italic font-mono bg-black/70 inline-block px-3 py-1 border border-gray-800">
            {{ caption }}
          </p>
        </div>
      {% endif %}
    </div>
  </div>

  {% if caption %}
    <figcaption class="text-xs text-gray-500 dark:text-gray-400 text-center mt-3 pt-7 mb-6 italic">
      {{ caption }}
    </figcaption>
  {% endif %}
</figure>
