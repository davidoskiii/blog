<figure class="mt-8 mb-6">

  <!-- Outer Container -->
  <div 
    x-data="{ 
      active: 0, 
      total: {{ images|length }},
      autoplayTimer: null,
      isPaused: {% if is_paused %}true{% else %}false{% endif %},
      touchStartX: 0,
      touchEndX: 0,
      isMaximized: false,
      
      next(manual = false) { 
        this.active = (this.active + 1) % this.total;
        if (manual && !this.isPaused) this.resetAutoplay();
      },
      prev(manual = false) { 
        this.active = (this.active - 1 + this.total) % this.total;
        if (manual && !this.isPaused) this.resetAutoplay();
      },
      
      startAutoplay() {
        this.stopAutoplay();
        if (this.total > 1 && !this.isMaximized && !this.isPaused) {
          this.autoplayTimer = setInterval(() => this.next(), {{ speed }});
        }
      },
      stopAutoplay() {
        if (this.autoplayTimer) {
          clearInterval(this.autoplayTimer);
          this.autoplayTimer = null;
        }
      },
      resetAutoplay() {
        this.stopAutoplay();
        this.startAutoplay();
      },
      togglePause() {
        this.isPaused = !this.isPaused;
        if (this.isPaused) {
          this.stopAutoplay();
        } else {
          this.startAutoplay();
        }
      },
      
      openLightbox() {
        this.stopAutoplay();
        this.isMaximized = true;
      },
      closeLightbox() {
        this.isMaximized = false;
        if (!this.isPaused) this.startAutoplay();
      },
      
      handleTouchStart(e) {
        this.touchStartX = e.changedTouches[0].screenX;
      },
      handleTouchEnd(e) {
        this.touchEndX = e.changedTouches[0].screenX;
        this.handleSwipe();
      },
      handleSwipe() {
        const swipeThreshold = 40;
        if (this.touchEndX < this.touchStartX - swipeThreshold) {
          this.next(true);
        } else if (this.touchEndX > this.touchStartX + swipeThreshold) {
          this.prev(true);
        }
      }
    }" 
    x-init="startAutoplay()"
    @mouseenter="if (!isPaused) stopAutoplay()"
    @mouseleave="if (!isMaximized && !isPaused) startAutoplay()"
    @touchstart="handleTouchStart($event)"
    @touchend="handleTouchEnd($event)"
    @keydown.escape.window="closeLightbox()"
    @keydown.left.window="if (isMaximized) prev(true)"
    @keydown.right.window="if (isMaximized) next(true)"
    class="relative group max-w-full md:max-w-2xl mx-auto border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-gray-900 shadow-lg font-mono overflow-hidden select-none"
  >
    <!-- Slides Container -->
    <div class="w-full bg-gray-200/50 dark:bg-black/40 {% if is_relative %}grid grid-cols-1{% else %}relative h-[200px] sm:h-[320px]{% endif %}">
      
      {% if is_relative %}
        <!-- Hidden Spacer Grid: Locks static container size to the tallest image in the set -->
        <div class="col-start-1 row-start-1 grid grid-cols-1 invisible pointer-events-none" aria-hidden="true">
          {% for image in images %}
            <div class="col-start-1 row-start-1 p-2 flex items-center justify-center">
              <img src="{{ image }}" class="w-full h-auto max-h-[75vh] object-contain" />
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <!-- Visible Slides -->
      {% for image in images %}
        <div 
          x-show="active === {{ forloop.counter0 }}" 
          x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 scale-95"
          x-transition:enter-end="opacity-100 scale-100"
          class="{% if is_relative %}col-start-1 row-start-1 w-full flex items-center justify-center p-2{% else %}absolute inset-0 flex items-center justify-center p-2{% endif %}"
        >
          <img 
            src="{{ image }}" 
            alt="Slide {{ forloop.counter }}" 
            @click="openLightbox()"
            class="{% if is_relative %}w-full h-auto max-h-[75vh]{% else %}max-h-full max-w-full{% endif %} object-contain mx-auto cursor-zoom-in"
            loading="lazy"
          />
        </div>
      {% endfor %}
    </div>

    <!-- Arrow Navigation Buttons -->
    {% if images|length > 1 %}
      <button 
        @click="prev(true)" 
        type="button" 
        class="hidden sm:flex absolute left-2 top-1/2 -translate-y-1/2 bg-gray-200/90 dark:bg-gray-900/80 hover:bg-white dark:hover:bg-black text-gray-800 dark:text-gray-200 border border-gray-400 dark:border-gray-600 w-8 h-8 items-center justify-center text-sm transition cursor-pointer z-10"
        aria-label="Previous slide"
      >
        &lt;
      </button>

      <button 
        @click="next(true)" 
        type="button" 
        class="hidden sm:flex absolute right-2 top-1/2 -translate-y-1/2 bg-gray-200/90 dark:bg-gray-900/80 hover:bg-white dark:hover:bg-black text-gray-800 dark:text-gray-200 border border-gray-400 dark:border-gray-600 w-8 h-8 items-center justify-center text-sm transition cursor-pointer z-10"
        aria-label="Next slide"
      >
        &gt;
      </button>
    {% endif %}

    <!-- Slide Indicator Badge & Pause Toggle -->
    <div class="absolute bottom-2 right-2 flex items-center space-x-1.5 bg-gray-200/80 dark:bg-black/70 px-2 py-0.5 border border-gray-400 dark:border-gray-700 text-[10px] text-gray-700 dark:text-gray-300 z-10">
      {% if images|length > 1 %}
        <button 
          @click="togglePause()" 
          type="button" 
          class="hover:text-black dark:hover:text-white font-bold cursor-pointer transition-colors"
          title="Pause/Play autoplay"
        >
          <span x-text="isPaused ? '[>]' : '[||]'"></span>
        </button>
      {% endif %}
      <span>
        [<span x-text="active + 1" class="text-black dark:text-white font-bold"></span>/<span>{{ images|length }}</span>]
      </span>
    </div>

    <!-- Full-Screen Lightbox Modal -->
    <div 
      x-show="isMaximized" 
      @click="closeLightbox()"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex flex-col items-center justify-center p-4 sm:p-8 cursor-pointer"
      style="display: none;"
    >
      <!-- Top Action Bar -->
      <div class="absolute top-4 right-4 flex items-center space-x-4 z-50" @click.stop>
        <span class="text-xs text-gray-400 font-mono">
          [<span x-text="active + 1" class="text-white font-bold"></span>/<span>{{ images|length }}</span>]
        </span>
        <button 
          @click="closeLightbox()" 
          type="button" 
          class="text-gray-300 hover:text-white border border-gray-600 hover:border-gray-400 px-3 py-1 text-xs font-mono bg-black/60 transition cursor-pointer"
        >
          [x] Chiudi
        </button>
      </div>

      <!-- Maximized Image Container -->
      <div class="relative w-full h-full flex items-center justify-center">
        {% for image in images %}
          <img 
            x-show="active === {{ forloop.counter0 }}" 
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            src="{{ image }}" 
            alt="Slide {{ forloop.counter }} Maximized" 
            @click.stop
            class="max-h-full max-w-full object-contain mx-auto shadow-2xl cursor-default"
          />
        {% endfor %}
      </div>

      <!-- Lightbox Arrow Navigation -->
      {% if images|length > 1 %}
        <button 
          @click.stop="prev(true)" 
          type="button" 
          class="hidden sm:flex absolute left-4 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-black text-white border border-gray-600 w-10 h-10 items-center justify-center text-base transition cursor-pointer z-50"
          aria-label="Previous slide"
        >
          &lt;
        </button>

        <button 
          @click.stop="next(true)" 
          type="button" 
          class="hidden sm:flex absolute right-4 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-black text-white border border-gray-600 w-10 h-10 items-center justify-center text-base transition cursor-pointer z-50"
          aria-label="Next slide"
        >
          &gt;
        </button>
      {% endif %}

      <!-- Optional Caption Overlay in Lightbox -->
      {% if caption %}
        <div class="absolute bottom-4 inset-x-0 text-center px-4" @click.stop>
          <p class="text-xs text-gray-300 italic font-mono bg-black/70 inline-block px-3 py-1 border border-gray-800">
            {{ caption }}
          </p>
        </div>
      {% endif %}
    </div>
  </div>

  {% if caption %}
    <figcaption class="text-xs text-gray-500 dark:text-gray-400 text-center mt-3 pt-7 mb-6 italic">
      {{ caption }}
    </figcaption>
  {% endif %}
</figure>
