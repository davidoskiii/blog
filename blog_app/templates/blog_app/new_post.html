{% extends 'blog_app/base.html' %}

{% block content %}

<!-- Back Navigation -->
<div class="mb-8 font-mono text-xs">
  <a href="{% url 'blog_app:posts' %}" class="text-gray-500 hover:text-black underline underline-offset-4">
    &lt;-- cancel_and_back_to_archive
  </a>
</div>

<div class="w-full font-mono">
  <!-- Section Header -->
  <div class="flex justify-between items-baseline border-b border-gray-600 pb-2 mb-8">
    <h1 class="text-2xl font-mono uppercase tracking-wider text-gray-700">
      NEW_POST <span class="text-xs font-normal lowercase text-gray-400">// create entry</span>
    </h1>
  </div>

  <!-- Main Form -->
  <form action="{% url 'blog_app:new_post' %}" method="post" class="space-y-6 w-full">
      {% csrf_token %}
      
      <!-- Django Form Styling Wrapper -->
      <div class="space-y-4 text-xs w-full
                  [&_label]:block [&_label]:text-gray-500 [&_label]:uppercase [&_label]:tracking-wider [&_label]:mb-1
                  [&_input]:w-full [&_input]:p-2 [&_input]:border [&_input]:border-gray-600 [&_input]:bg-transparent [&_input]:text-sm [&_input]:text-gray-800 [&_input]:focus:outline-none [&_input]:focus:border-black
                  [&_select]:w-full [&_select]:p-2 [&_select]:border [&_select]:border-gray-600 [&_select]:bg-transparent [&_select]:text-sm [&_select]:text-gray-800 [&_select]:focus:outline-none [&_select]:focus:border-black
                  [&_textarea]:w-full [&_textarea]:p-2 [&_textarea]:border [&_textarea]:border-gray-600 [&_textarea]:bg-transparent [&_textarea]:text-sm [&_textarea]:text-gray-800 [&_textarea]:focus:outline-none [&_textarea]:focus:border-black">
        {{ form.as_div }}
      </div>
      
      <!-- Form Actions Bar -->
      <div class="pt-6 flex items-center justify-end space-x-4 border-t border-gray-300 text-xs">
        <a href="{% url 'blog_app:posts' %}" class="text-gray-500 hover:text-black underline cursor-pointer">
          cancel
        </a>
        <button type="submit" name="submit" class="text-gray-800 hover:text-black font-bold underline underline-offset-4 cursor-pointer">
          [+ publish_post]
        </button>
      </div>
  </form>
</div>

{% endblock content %}
