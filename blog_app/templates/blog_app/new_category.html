{% extends 'blog_app/base.html' %}

{% block content %}

<a href="{% url 'blog_app:posts' %}" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-indigo-600 mb-6 transition">
  &larr; Annulla e torna ai Posts
</a>

<div class="max-w-xl mx-auto bg-white rounded-2xl border border-gray-200 p-6 sm:p-8 shadow-sm">
  <h2 class="text-2xl font-extrabold text-gray-900 mb-6">Crea una nuova Categoria</h2> 

  <form action="{% url 'blog_app:new_category' %}" method="post" class="space-y-5">
      {% csrf_token %}
      
      <div class="space-y-4">
        {{ form.as_div }}
      </div>
      
      <div class="pt-4 flex items-center justify-end space-x-3 border-t border-gray-100">
        <a href="{% url 'blog_app:posts' %}" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-800 transition">
          Annulla
        </a>
        <button type="submit" name="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-5 py-2.5 rounded-lg transition shadow-sm">
          Crea categoria
        </button>
      </div>
  </form>
</div>

{% endblock content %}
