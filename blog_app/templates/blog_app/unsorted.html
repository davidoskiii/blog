{% extends 'blog_app/base.html' %}

{% block content %}

<h2>Unsorted Posts</h2> 

<ul>
  {% for post in posts %}
    <li>
      <a href="{% url 'blog_app:post' post.id %}">
        <h3>{{ post.title }}</h3>
      </a>
    </li>
  {% empty %}
    <li>Non ci sono Post non catalogati.</li>
  {% endfor %}
</ul>

<a href="{% url 'blog_app:posts' %}">Torna a tutti i posts</a>

{% endblock content %}
