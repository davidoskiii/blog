{% if user.is_authenticated %}
    <span>Ciao, <strong>{{ user.username }}</strong>!</span>
    <form action="{% url 'accounts:logout' %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit">Esci</button>
    </form>
{% else %}
    <a href="{% url 'accounts:register' %}">Registrati</a> | 
    <a href="{% url 'accounts:login' %}">Accedi</a>
{% endif %}


<p>
  <a href="{% url 'blog_app:index' %}">Blog<a>
  <a href="{% url 'blog_app:posts' %}">Posts<a>

{% if user.is_superuser %}
  <a href="{% url 'blog_app:new_post' %}">Crea Post</a> 
{% endif %}
</p>

{% block content %}{% endblock content %}
