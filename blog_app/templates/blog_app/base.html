{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <title>{% block title %}Blog{% endblock %}</title>
</head>
<body class="font-serif antialiased min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="w-full py-8 bg-transparent">
    <div class="max-w-4xl mx-auto px-4">
      <nav class="flex items-center justify-center space-x-3 text-base sm:text-lg tracking-wide">

        <!-- Archivio -->
        <a href="{% url 'blog_app:posts' %}" class="underline underline-offset-4 text-gray-600 hover:text-black transition">
          archivio
        </a>

        {% if user.is_superuser %}
          <span class="text-xs select-none">•</span>
          <a href="{% url 'blog_app:new_post' %}" class="underline underline-offset-4 text-gray-600 hover:text-black transition">
            nuovo
          </a>
        {% endif %}

        <span class="text-xs select-none">•</span>

        <!-- Search Bar styled as minimalist link/input -->
        <form action="{% url 'blog_app:search' %}" method="get" class="inline-flex items-center">
          <input 
            type="text" 
            name="q" 
            value="{{ request.GET.q }}"
            placeholder="cerca..." 
            class="bg-transparent border-b border-gray-600 text-gray-600 placeholder-gray-500 text-base sm:text-lg font-serif focus:outline-none w-20 sm:w-28 focus:w-36 transition-all duration-200 px-1"
            required
          >
        </form>

        <span class="text-xs select-none">•</span>

        <!-- Auth Status -->
        {% if user.is_authenticated %}
          <form action="{% url 'accounts:logout' %}" method="post" class="inline">
            {% csrf_token %}
            <button type="submit" class="underline underline-offset-4 text-gray-600 hover:text-black transition ml-1">
              esci
            </button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}" class="underline underline-offset-4 text-gray-600 hover:text-black transition">
            accedi
          </a>
        {% endif %}

      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
    {% block content %}{% endblock content %}
  </main>

  <!-- FOOTER -->
  <footer class="py-8 mt-12 text-center text-xs text-gray-500 font-serif">
    &copy; Blog Personale. Tutti i diritti riservati.
  </footer>

</body>
</html>
